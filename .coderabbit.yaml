# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  poem: false
  path_filters:
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!**/build/**"
    - "!assets/**"
    - "!example/qa/**"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
  path_instructions:
    - path: "lib/**"
      instructions: >-
        실제 버그, 공개 API 호환성, 접근성, Flutter 레이아웃과 상태 처리를
        우선 검토하세요. 이 패키지는 인증을 수행하지 않는 코드 전용 UI입니다.
        SocialButton은 소비 앱의 필수 logo 자산 경로를 사용하며 로고를 자동
        교체하거나 재색칠하지 않습니다. 근거 없는 대규모 리팩터링은 제안하지 마세요.
    - path: "test/**"
      instructions: >-
        회귀를 실제로 탐지하는지, 비동기 처리가 결정적인지 검토하세요.
        테스트를 통과시키기 위한 skip, 검증 약화, 고정 sleep은 제안하지 마세요.
    - path: "**/*.md"
      instructions: >-
        공개 API와 설치 및 사용 예제가 현재 코드와 일치하는지 검토하세요.
        필수 인자 누락, 중복 인자와 코드 전용 패키지에 번들 로고가 있다는
        설명을 지적하세요. 단순 문체 수정은 최소화하세요.
chat:
  auto_reply: false
