name: Package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.29.0', '3.29.2']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: flutter analyze
      - working-directory: example
        run: flutter test
      - working-directory: example
        run: flutter build web --release
      - run: dart pub publish --dry-run
