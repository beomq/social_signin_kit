name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public static site
        run: |
          mkdir -p _site/landing _site/assets
          cp index.html _site/index.html
          cp landing/*.html landing/*.css landing/*.js landing/logo-catalog.json _site/landing/
          rsync -a --exclude='*.zip' --exclude='*.pdf' --exclude='*.psd' --exclude='*.ai' --exclude='.DS_Store' assets/ _site/assets/
          cp -R docs _site/docs
          mkdir -p _site/research/official-default-replacement
          cp research/official-default-replacement/replacement-receipts.json research/official-default-replacement/remaining-seven.md research/official-default-replacement/QA.md _site/research/official-default-replacement/
          cp README.md LICENSE THIRD_PARTY_NOTICES.md DOWNLOAD_GUIDE.md download-plan.json _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
