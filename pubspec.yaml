name: social_signin_kit
description: Social sign-in and connection buttons with provider presets, bundled logos, and Korean/English labels.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  assets:
    - assets/social/
    - assets/original/github/GitHub_Invertocat_Black.png
    - assets/original/github/GitHub_Invertocat_White.png
    - assets/original/x/logo-black.png
    - assets/original/x/logo-white.png
    - assets/original/discord/Discord-Symbol-Black.png
    - assets/original/discord/Discord-Symbol-White.png
    - assets/original/slack/SLA-Slack-icon-black-RGB.png
    - assets/original/slack/SLA-Slack-icon-white-RGB.png
    - assets/original/linkedin/LI-In-Bug.png
    - assets/original/linkedin/InBug-White.png
    - assets/original/twitch/glitch_flat_black-ops.png
    - assets/original/twitch/glitch_flat_white.png
    - assets/original/spotify/Spotify_Primary_Logo_RGB_Black.png
    - assets/original/spotify/Spotify_Primary_Logo_RGB_White.png
    - assets/original/reddit/Reddit_Logo.png
    - assets/original/gitlab/gitlab-logo-500-rgb.png
    - assets/original/bitbucket/Bitbucket_icon.png
    - assets/original/telegram/Logo.png
    - assets/original/weibo/LOGO_64x64.png
    - assets/original/paypal/PayPal-Monogram-FullColor-RGB.png
    - assets/original/naver/NAVER_login_Light_KR_green_icon_H56.png
    - assets/original/naver/NAVER_login_Dark_KR_green_icon_H56.png
    - assets/original/line/line_88.png
    - assets/original/kakao/kakao_login_light.png
